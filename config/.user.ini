; ==============================================
; OJS 3.5 — PHP settings for LiteSpeed FastCGI
; genes.kz
; ==============================================
; LiteSpeed ignores php_value/php_flag in .htaccess when using FastCGI.
; Place this file in the document root (httpdocs/) alongside .htaccess.

upload_max_filesize = 512M
post_max_size = 512M
max_execution_time = 180
max_input_time = 180
memory_limit = 512M
max_input_vars = 10000
